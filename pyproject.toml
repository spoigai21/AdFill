[project]
name = "adfill"
version = "0.1.0"
description = "A guaranteed-delivery ad decision engine for streaming video"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "scikit-learn>=1.5",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "hypothesis>=6.100",
]

[project.scripts]
adfill = "adfill.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
